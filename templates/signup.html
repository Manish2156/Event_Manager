<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - College Event Manager</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
</head>

<body>

    <form action="" method="POST" class="user_info">

        <h1>Create Account</h1>

        <p class="subtitle">
            Join your college event community
        </p>


        <!-- NAME -->

        <label for="user_name">Name</label>

        <input type="text" id="user_name" name="user_name" placeholder="Enter your name" required>


        <!-- EMAIL -->

        <label for="user_email">Email</label>

        <input type="email" id="user_email" name="user_email" placeholder="Enter your email" required>


        <!-- YEAR -->

        <label for="user_year">Year</label>

        <select id="user_year" name="user_year" required>

            <option value="" disabled selected>
                Select your year
            </option>

            <option value="FY">
                First Year
            </option>

            <option value="SY">
                Second Year
            </option>

            <option value="TY">
                Third Year
            </option>

        </select>


        <!-- BRANCH -->

        <label for="user_branch">Branch</label>

        <select id="user_branch" name="user_branch" required>

            <option value="" disabled selected>
                Select your branch
            </option>

            <option value="BSC-IT">
                BSC-IT
            </option>

            <option value="BSC-CS">
                BSC-CS
            </option>

            <option value="LAW">
                LAW
            </option>

            <option value="B.COM">
                B.COM
            </option>

            <option value="B.ARTS">
                B.ARTS
            </option>

            <option value="BSC">
                BSC
            </option>

            <option value="BMS">
                BMS
            </option>

        </select>


        <!-- ROLL NUMBER -->

        <label for="user_rollno">Roll No.</label>

        <input type="text" id="user_rollno" name="user_rollno" placeholder="Enter your roll number" required>


        <!-- FAVOURITE CATEGORY -->

        <label for="fav_category">
            Favourite Category
        </label>

        <select id="fav_category" name="fav_category" required>

            <option value="" disabled selected>
                Select your favourite category
            </option>

            <option value="History">
                History
            </option>

            <option value="Science">
                Science
            </option>

            <option value="Arts,Music">
                Arts & Music
            </option>

            <option value="Literature">
                Literature
            </option>

            <option value="Cultural">
                Cultural Activity
            </option>

            <option value="Hackathon">
                Hackathon
            </option>

            <option value="Sports">
                Sports
            </option>

        </select>


        <!-- PASSWORD -->

        <label for="user_pass">
            Password
        </label>

        <input type="password" id="user_pass" name="user_pass" placeholder="Enter password" required>


        <!-- CONFIRM PASSWORD -->

        <label for="conf_pass">
            Confirm Password
        </label>

        <input type="password" id="conf_pass" name="conf_pass" placeholder="Re-enter password" required>

        <!-- SUBMIT -->

        <button type="submit">
            Create Account
        </button>

        <div class="already-account">
            <span>Already have an account?</span>
            <a href="/login">Login</a>
        </div>

    </form>

</body>

</html>
